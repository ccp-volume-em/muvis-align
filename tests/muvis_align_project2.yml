input_output:
  source_position_z: source
  source_position_y: source
  source_position_x: source
  source_scale_z: source
  source_scale_y: source
  source_scale_x: source
  source_rotation: source
  normalise_rotated_positions: false
  preview_scale: '1'
  coordinate_system: source_metadata
  metadata_table: []
  registration_dimension: space
  channels_table: []
  output_path: output2
  overwrite: true
  input_path: ../data/S*/*.zarr
pre_processing:
  scale: '1'
  flatfield_quantiles: ''
  normalisation: none
  filter_foreground: false
registration:
  operation: register
  pairing: orthogonal
  transform_type: rigid
  method: sift
  normalisation: true
  max_keypoints: 5000
  inlier_threshold_factor: 0.05
  max_trials: 1000
  ransac_iterations: 3
  split_binning: 8
  metrics_table: []
  groupwise_resolution_method: robust_linear
  gaussian_sigma: 3.0
  modify_pair_registration: false
  pair_registration: false
  preview_registration: false
  reg_preview_image1: S000_000_000
  reg_preview_image2: S000_000_001
fusion:
  method: average
  spacing: mean
  block_size: '1024'
  ome_version: '0.5'
