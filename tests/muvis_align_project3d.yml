input_output:
  source_position_z: source
  source_position_y: source
  source_position_x: source
  source_scale_z: source
  source_scale_y: source
  source_scale_x: source
  source_rotation: source
  preview_scale: '1'
  coordinate_system: source_metadata
  metadata_table: []
  registration_dimension: space
  channels_table:
    label:
    - '0'
    color:
    - (1, 1, 1)
  output_path: output
  overwrite: true
  input_path: ../data/3d/*.ome.zarr
pre_processing:
  scale: '1'
  flatfield_quantiles: ''
  normalisation: none
  filter_foreground: false
registration:
  operation: register
  pairing: orthogonal
  transform_type: rigid
  method: phase_correlation
  normalisation: true
  max_keypoints: 5000
  inlier_threshold_factor: 0.05
  max_trials: 1000
  ransac_iterations: 3
  metrics_table: []
  channel: '0'
  reg_preview_image1: X00_Y00
  reg_preview_image2: X00_Y01
  preview_registration: false
fusion:
  method: average
  spacing: mean
  tile_size: ''
  ome_version: '0.5'
  preview_fusion: false
