site_name: muvis-align
site_url: https://ccp-volume-em.github.io/muvis-align/
site_description: Image registration pipeline using multiview-stitcher and napari plugin

repo_name: muvis-align
repo_url: https://github.com/ccp-volume-em/muvis-align

# with `mkdocs build --strict` (see the docs CI job) these warnings become errors, so a
# dead cross-page link or a renamed heading someone still links to fails the build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_submodules: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - index.md
  - pipeline.md
  - napari.md
  - notebooks.md
  - poster.md
  - references.md

theme:
  name: material
  palette:
    # 'auto' with a toggle: follow the OS by default, let the reader override it
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
