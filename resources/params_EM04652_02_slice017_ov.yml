general:
  break_on_error: true
  metadata_summary: false
  logging:
    filename: log/muvis-align-EM04652-ov.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: false
operations:
- input_output:
    input_path: /nemo/project/proj-mrc-mm/raw/em/EM04652/EM04652_02_slice017/EM04652-02_slice17_spaghettiandmeatballs2/overviews/ov000/*.ome.tif
    source_position_y: 0
    source_position_x: 0
    extra_metadata:
      scale:
        z: 0.05
    output_path: ../../aligned_ov/
    preview_scale: 16
  pre_processing:
    normalisation: global
  registration:
    operation: register
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    pairing: stack
    method: orb
    gaussian_sigma: 2.5
    transform_type: affine
    n_parallel_pairwise_regs: 64
  fusion:
    format: ome.zarr
    block_size: [4096, 4096]
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: ome.zarr
    spacing: mean
