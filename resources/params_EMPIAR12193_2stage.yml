general:
  break_on_error: true
  metadata_summary: false
  logging:
    filename: log/muvis-align-empiar12193.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    mvs: true
    verbose: true
  debug: false
operations:
- input_output:
    input_path: /nemo/project/proj-ccp-vem/datasets/12193/data/S*/*.tiff
    source_scale_x: 0.004
    source_scale_y: 0.004
    source_scale_z: 0.1
    source_position_y: fn[-3]*24
    source_position_x: fn[-2]*24
    source_position_z: S*0.1
    extra_metadata: ../../aligned_stitched_mappings1.json
    output_path: ../../aligned2/
  pre_processing:
    scale: 8
    flatfield_quantiles: [0.5]
  registration:
    operation: register
    normalisation: true
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    pairing: stack
    method: orb
    gaussian_sigma: 2
    transform_type: rigid
    groupwise_resolution_method: linear_two_pass
    n_parallel_pairwise_regs: 64
  fusion:
    format: ome.zarr
    block_size: [4096, 4096]
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: ome.zarr
