general:
  break_on_error: true
  metadata_summary: false
  logging:
    filename: log/muvis-align-empiar12193.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
  debug: true
operations:
- input_output:
    input_path: D:/slides/12193/stitched_subset/S???/registered.ome.zarr
    extra_metadata:
      scale:
        z: 0.1
    output_path: ../../aligned_subset/
  pre_processing:
    scale: 4
  registration:
    operation: register
    max_keypoints: 5000
    gaussian_sigma: 10
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    pairing: stack
    method: orb
    transform_type: rigid
  fusion:
    format: ome.zarr
    block_size: [4096, 4096]
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: null
