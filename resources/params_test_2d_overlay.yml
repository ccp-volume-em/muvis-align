general:
  logging:
    verbose: true
operations:
- input_output:
    input_path: [data/S000/S000_000_000.ome.zarr, data/S001/S001_000_001.ome.zarr]
    extra_metadata: ../aligned_stitched_mappings1.json
    labels: [S000_000_000, S001_000_001]
    output_path: ../../output/overlay/
    overwrite: true
  registration:
    operation: register
    pairing: orthogonal
    transform_type: rigid
    method: orb
    gaussian_sigma: 2
    normalisation: true
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    metrics: [ncc, ssim, onmi]
    n_parallel_pairwise_regs: 1
  fusion:
    format: ome.zarr
