general:
  break_on_error: false
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
operations:
- input_output:
    input_path: D:/slides/EM04788_02_Sub_02/10nm/subset/*.tif
    source_metadata:
      x: 0
      y: 0
    extra_metadata:
      scale:
        z: 0.05
    output_path: aligned/
  pre_processing:
    normalisation: global
  registration:
    operation: register
    method: cpd
    pairing: stack
  fusion:
    format: ome.tiff
    block_size: []
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
