general:
  logging:
    verbose: true
operations:
- input_output:
    input_path: D:/slides/Emb3_2x2_Mosaic_2CAMs/*.zarr
    output_path: stitched/
    overwrite: true
  pre_processing:
    scale: 4
  registration:
    operation: register
    pairing: orthogonal
    transform_type: rigid
    method: cpd
    gaussian_sigma: 1
    normalisation: true
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    metrics: [ncc, ssim, onmi]
    n_parallel_pairwise_regs: 1
  fusion:
    format: ome.zarr
