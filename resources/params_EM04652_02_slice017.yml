general:
  logging:
    filename: log/muvis-align-EM04652.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    verbose: true
operations:
- input_output:
    input_path: ['C:/Project/slides/EM04652-02_slice17_spaghettiandmeatballs2/data_*/*.ome.tif']
    output_path: ../../all_fused/
    preview_scale: 1um
  registration:
    operation: register
    transform_type: translation
    pairing: orthogonal
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    method: phase_correlation
  fusion:
    format: ome.zarr
    ome_version: 0.5
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: null
