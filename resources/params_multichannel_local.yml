general:
  break_on_error: true
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
operations:
- input_output:
    input_path: D:/slides/EM04768_01_substrate_04/Reflection/20_percent_overlap/subselection3/*.ome.tiff
    source_metadata: invert
    output_path: D:/slides/EM04768_01_substrate_04/registered/reflection_stitched2/
  pre_processing:
    normalisation: true
  registration:
    operation: register
    normalisation: true
    gaussian_sigma: 1.5
    transform_type: translation
    pairing: orthogonal
    method: phase_correlation
  fusion:
    format: ome.zarr, ome.tiff
    block_size: [4096, 4096]
    compression: []
    npyramid_add: 4
    pyramid_downsample: 2
