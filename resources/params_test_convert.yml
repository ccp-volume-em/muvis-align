general:
  logging:
    verbose: true
operations:
- input_output:
    input_path: data/*/*.tiff
    source_scale_x: 0.032
    source_scale_y: 0.032
    source_position_y: fn[-3]*24
    source_position_x: fn[-2]*24
    output_path: ../../output/
    overwrite: true
  registration:
    operation: convert
    pairing: orthogonal
    transform_type: affine
    method: sift
    gaussian_sigma: 2
    normalisation: true
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
  fusion:
    format: ome.zarr
