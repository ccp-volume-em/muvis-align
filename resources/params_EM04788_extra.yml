general:
  break_on_error: false
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
  verbose: false
operations:
- input_output:
    input_path: /nemo/project/proj-czi-vp/processed/em/EM04788/EM04788_03/EM04788_03_Sub_01/10 nm pixel/Section7/.*_t\d{4}.*.tif
    normalise_rotated_positions: true
    output_path: stitched/
  registration:
    operation: register
    method: phase_correlation
    normalisation: true
    pairing: orthogonal
  fusion:
    format: ome.zarr, ome.tiff
    block_size: &id001 []
    compression: &id002 []
    npyramid_add: 4
    pyramid_downsample: 2
- input_output:
