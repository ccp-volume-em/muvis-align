general:
  break_on_error: true
  metadata_summary: false
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
  ui: napari
operations:
- input_output:
    input_path: D:/slides/EM04654_slice011/tiles_slice21_24/g????/t????/*.ome.tif
    source_position_x: '{t} % 15 * 38.96'
    source_position_y: '{t} // 15 * 28.72'
    output_path: ../../../stitched/slice{s}/
  pre_processing:
    normalisation: global
  registration:
    operation: register match s
    method: phase_correlation
    pairing: orthogonal
  fusion:
    format: ome.zarr
    block_size: &id001 [4096, 4096]
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: ome.tiff
- input_output:
    input_path: D:/slides/EM04654_slice011/stitched/slice?????/registered.ome.zarr
    extra_metadata:
      scale:
        z: 0.1
    output_path: ../../aligned/
  registration:
    operation: register
    method: phase_correlation
    pairing: stack
  fusion:
    format: ome.zarr
    block_size: *id001
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: ome.tiff
