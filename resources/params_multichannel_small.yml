general:
  break_on_error: true
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
operations:
- input_output:
    input_path: ['D:/slides/EM04768_01_substrate_04/Reflection/20_percent_overlap/ome_tif_reflection/converted/tiles_1_MMStack_New
        Grid 1-Grid_5_15.ome.tiff', 'D:/slides/EM04768_01_substrate_04/Fluorescence/20_percent_overlap/EM04768_01_sub_04_fluorescence_10x/converted/tiles_1_MMStack_New
        Grid 1-Grid_5_15.ome.tiff']
    source_position_z: 0
    channels_table:
      label: [reflection, fluorescence]
      color: ['(1, 1, 1, 1)', '(0, 1, 0, 1)']
    output_path: D:/slides/EM04768_01_substrate_04/output_test/
  pre_processing:
    normalisation: true
  registration:
    operation: register
    normalisation: true
    gaussian_sigma: 1.5
    transform_type: translation
    pairing: orthogonal
    method: phase_correlation
  fusion:
    format: ome.zarr, ome.tiff
    block_size: []
    compression: []
    npyramid_add: 4
    pyramid_downsample: 2
