general:
  break_on_error: true
  metadata_summary: false
  logging:
    filename: log/muvis-align-empiar12193.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
operations:
- input_output:
    input_path: D:/slides/12193/data_subset_small/S*/*.tiff
    source_scale_x: 0.004
    source_scale_y: 0.004
    source_position_y: fn[-3]*24
    source_position_x: fn[-2]*24
    output_path: ../../stitched/S{S}/
    preview_scale: 32
    overwrite: false
  pre_processing:
    scale: 4
  registration:
    operation: register match S
    pairing: orthogonal
    normalisation: true
    transform_type: translation
    gaussian_sigma: 1
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    method: sift
  fusion:
    format: ome.zarr
    block_size: &id001 [4096, 4096]
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: ome.zarr
- input_output:
    input_path: D:/slides/12193/stitched/S*/registered.ome.zarr
    extra_metadata:
      scale:
        z: 0.1
    output_path: ../../aligned/
    preview_scale: 32
    overwrite: false
  pre_processing:
    scale: 8
  registration:
    operation: register
    normalisation: true
    transform_type: rigid
    gaussian_sigma: 3
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    pairing: stack
    method: sift
  fusion:
    format: ome.zarr
    block_size: *id001
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
    preview: ome.zarr
