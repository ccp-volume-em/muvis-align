general:
  break_on_error: true
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
operations:
- input_output:
    input_path: D:/slides/EM04768_01_substrate_04/Reflection/20_percent_overlap/subselection/*.ome.tiff
    source_metadata: invert
    output_path: D:/slides/EM04768_01_substrate_04/registered/reflection_stitched3/
  pre_processing:
    normalisation: global
  registration:
    operation: register
    method: phase_correlation
    pairing: orthogonal
  fusion:
    format: ome.tiff, ome.zarr
    block_size: []
    compression: []
    npyramid_add: 4
    pyramid_downsample: 2
