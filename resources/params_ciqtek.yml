general:
  break_on_error: true
  metadata_summary: false
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
operations:
- input_output:
    input_path: C:/Project/slides/Ciqtek/Automap/*Region1_r1*.tiff
    normalise_rotated_positions: true
    output_path: output/
    overwrite: false
  pre_processing:
    scale: 4
  registration:
    operation: register
    pairing: orthogonal
    normalisation: true
    transform_type: translation
    gaussian_sigma: 1
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    method: sift
  fusion:
    format: ome.zarr
    block_size: [4096, 4096]
    compression: null
    npyramid_add: 4
    pyramid_downsample: 2
