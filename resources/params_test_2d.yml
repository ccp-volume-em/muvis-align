general:
  logging:
    verbose: true
operations:
- input_output:
    input_path: data/S000/*.zarr
    output_path: ../../output/stitched/
    overwrite: true
  registration:
    operation: register
    pairing: orthogonal
    transform_type: rigid
    method: orb
    gaussian_sigma: 2
    normalisation: true
    max_keypoints: 5000
    inlier_threshold_factor: 0.05
    max_trials: 1000
    ransac_iterations: 3
    metrics: [ncc, ssim, onmi]
    n_parallel_pairwise_regs: 1
  fusion:
    format: ome.zarr
