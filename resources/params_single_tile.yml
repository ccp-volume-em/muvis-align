general:
  break_on_error: false
  logging:
    filename: log/muvis-align.log
    format: '%(asctime)s %(levelname)s: %(message)s'
    dask: true
    time: true
    verbose: true
operations:
- input_output:
    input_path: C:/Project/slides/EM04768_01_substrate_04/EM/a0004/roi0000/10_nm_pixel_size_a0004_roi0000_t0000.ome.tif
    normalise_rotated_positions: true
    output_path: test/
  pre_processing:
    normalisation: global
    filter_foreground: false
  registration:
    operation: register
    method: phase_correlation
    pairing: orthogonal
    channel: 0
  fusion:
    format: ome.zarr, ome.tiff
    block_size: []
    compression: []
    npyramid_add: 4
    pyramid_downsample: 2
